name: test
on: [push, pull_request]
jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q tmux fzf shellcheck
      - run: shellcheck -x -S warning palette.tmux scripts/*.sh tests/e2e.sh
      - run: tests/e2e.sh
